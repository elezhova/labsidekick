title: "Определение активности АХЭ и БХЭ (метод Эллмана)"
description: "Модифицированный метод Эллмана. Измерение OD при 405 нм через 5 мин после внесения субстрата."

notes:
  - "В контрольные лунки вносить SDS (12.5 мкл) СТРОГО ДО субстрата."
  - "В опытные лунки вносить SDS (12.5 мкл) СТРОГО ПОСЛЕ прохождения реакции (через 5 мин)."
  - "Раскапывать калибровку лучше начиная с воды, а затем по возрастанию концентрации цистеина."

steps:
  - "1. Разведите плазму водой: для крысы 1:29 (30 мкл плазмы + 870 мкл H2O), для человека 1:14 (30 мкл + 420 мкл)."
  - "2. Внесите по 40 мкл разведенной пробы в контрольные и опытные лунки."
  - "3. Добавьте рабочий раствор (DTNB + H2O, а для АХЭ еще 10 мкл этопропазина)."
  - "4. ВНИМАНИЕ: внесите 12.5 мкл SDS в КОНТРОЛЬНЫЕ лунки СТРОГО ДО субстрата."
  - "5. Добавьте 12.5 мкл субстрата (АТХ или БТХ) во все лунки и включите таймер на 5 минут."
  - "6. Ровно через 5 минут остановите реакцию, добавив 12.5 мкл SDS в ОПЫТНЫЕ лунки."
  - "7. Измерьте оптическую плотность при 405 нм."

reagents:
  - id: "dtnb"
    name: "DTNB (реактив Эллмана) на Na-Na фосфатном буфере pH 7.4"
    mr: 396.3
    molarity_mm: 2.0
    volume_ml: 250.0
  - id: "cys"
    name: "Цистеин (исходный раствор для калибровки)"
    mr: 121.2
    molarity_mm: 5.0
    volume_ml: 1.0

calibration:
  start_molarity_mm: 5.0
  tubes_count: 7
  well_sample_ul: 12.5
  well_h2o_ul: 80.0
  well_dtnb_ul: 25.0
  well_sds_ul: 12.5

modes:
  - name: "Удельная общая активность ХЭ"
    components:
      "Разбавленная проба": 40.0
      "DTNB (р-в Эллмана)": 25.0
      "H2O дист.": 40.0
      "Субстрат (АТХ)": 12.5
      "SDS (3%)": 12.5
  - name: "Удельная активность БХЭ"
    components:
      "Разбавленная проба": 40.0
      "DTNB (р-в Эллмана)": 25.0
      "H2O дист.": 40.0
      "Субстрат (БТХ)": 12.5
      "SDS (3%)": 12.5
  - name: "Удельная активность АХЭ"
    components:
      "Разбавленная проба": 40.0
      "DTNB (р-в Эллмана)": 25.0
      "H2O дист.": 30.0
      "Ингибитор БХ (Этопропазин)": 10.0
      "Субстрат (АТХ)": 12.5
      "SDS (3%)": 12.5
  - name: "Калибровка по цистеину"
    components:
      "H2O дист.": 80.0
      "Раствор цистеина (из пробирок)": 12.5
      "DTNB (р-в Эллмана)": 25.0
      "SDS (3%)": 12.5

activity_params:
  v_total_ml: 0.13
  v_sample_ml: 0.04
  time_min: 5.0
  epsilon: 13600.0
  optical_path_cm: 0.43
  dilutions:
    "Плазма крови человека (1:14 -> 15x)": 15.0
    "Плазма крови крысы (1:29 -> 30x)": 30.0
